name: Foundation checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: false
      - name: Verify Rust workspace without Test262
        run: |
          rustup show active-toolchain
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --frozen -- -D warnings
          cargo test --workspace --frozen
          cargo test --workspace --frozen --release
      - name: Check pinned Test262 data (no execution)
        run: |
          git submodule update --init --depth 1 -- vendor/test262
          sh tools/check-test262.sh
